name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
      - uses: dtolnay/rust-toolchain@efa25f7f19611383d5b0ccf2d1c8914531636bf9 # stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@ad397744b0d591a723ab90405b7247fac0e6b8db # v2
      - name: Validate tag, package version, and changelog
        run: |
          VERSION=$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["package"]["version"])')
          test "${GITHUB_REF_NAME#v}" = "$VERSION"
          grep -F "## [$VERSION]" CHANGELOG.md
      - run: cargo fmt --all --check
        env:
          CARGO_TERM_COLOR: always
      - run: cargo build --locked --all-targets --all-features
        env:
          CARGO_TERM_COLOR: always
      - run: cargo clippy --locked --all-targets --all-features -- -D warnings
        env:
          CARGO_TERM_COLOR: always
      - run: cargo test --locked --all-features
        env:
          CARGO_TERM_COLOR: always
      - run: cargo publish --dry-run --locked --no-verify
        env:
          CARGO_TERM_COLOR: always

  publish:
    name: Publish to crates.io
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
      - uses: dtolnay/rust-toolchain@efa25f7f19611383d5b0ccf2d1c8914531636bf9 # stable
      - uses: Swatinem/rust-cache@ad397744b0d591a723ab90405b7247fac0e6b8db # v2
      - name: Package release
        run: |
          cargo package --locked
          shasum -a 256 target/package/ojs-*.crate > target/package/checksums.txt
        env:
          CARGO_TERM_COLOR: always
      - name: Generate SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          path: target/package
          artifact-name: ojs-sbom.spdx.json
          output-file: target/package/ojs-sbom.spdx.json
      - name: Attest build provenance
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-path: target/package/ojs-*.crate
      - name: Upload release artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ojs-release
          path: |
            target/package/ojs-*.crate
            target/package/ojs-sbom.spdx.json
            target/package/checksums.txt
      - run: cargo publish --locked
        env:
          CARGO_TERM_COLOR: always
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

  github-release:
    name: GitHub Release
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ojs-release
          path: release-artifacts
      - name: Create GitHub Release
        uses: softprops/action-gh-release@a06a81a03ee405af7f2048a818ed3f03bbf83c7b # v2
        with:
          generate_release_notes: true
          files: release-artifacts/*
