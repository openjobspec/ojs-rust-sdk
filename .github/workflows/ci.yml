name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
      - uses: dtolnay/rust-toolchain@efa25f7f19611383d5b0ccf2d1c8914531636bf9 # stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check
        env:
          CARGO_TERM_COLOR: always

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
      - uses: dtolnay/rust-toolchain@efa25f7f19611383d5b0ccf2d1c8914531636bf9 # stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@ad397744b0d591a723ab90405b7247fac0e6b8db # v2
      - run: cargo clippy --locked --all-targets --all-features -- -D warnings
        env:
          CARGO_TERM_COLOR: always

  test:
    name: Test (${{ matrix.rust }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        rust: [stable, "1.75"]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
      - uses: dtolnay/rust-toolchain@efa25f7f19611383d5b0ccf2d1c8914531636bf9 # master
        with:
          toolchain: ${{ matrix.rust }}
      - uses: Swatinem/rust-cache@ad397744b0d591a723ab90405b7247fac0e6b8db # v2
      - run: cargo test --locked --all-features
        env:
          CARGO_TERM_COLOR: always

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
      - uses: dtolnay/rust-toolchain@efa25f7f19611383d5b0ccf2d1c8914531636bf9 # stable
      - uses: Swatinem/rust-cache@ad397744b0d591a723ab90405b7247fac0e6b8db # v2
      - name: Install cargo-tarpaulin
        run: cargo install cargo-tarpaulin --locked
        env:
          CARGO_TERM_COLOR: always
      - name: Run coverage
        run: cargo tarpaulin --all-features --out xml --fail-under 75
        env:
          CARGO_TERM_COLOR: always
      - name: Upload coverage report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: coverage-report
          path: cobertura.xml

  doc:
    name: Documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
      - uses: dtolnay/rust-toolchain@efa25f7f19611383d5b0ccf2d1c8914531636bf9 # stable
      - uses: Swatinem/rust-cache@ad397744b0d591a723ab90405b7247fac0e6b8db # v2
      - run: cargo doc --locked --no-deps --all-features
        env:
          CARGO_TERM_COLOR: always
          RUSTDOCFLAGS: -D warnings

  security:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
      - name: Install current stable Rust
        uses: dtolnay/rust-toolchain@efa25f7f19611383d5b0ccf2d1c8914531636bf9 # stable
      - uses: rustsec/audit-check@69366f33c96575abad1ee0dba8212993eecbe998 # v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  deny:
    name: Supply Chain
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
      - name: Install current stable Rust
        uses: dtolnay/rust-toolchain@efa25f7f19611383d5b0ccf2d1c8914531636bf9 # stable
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2

  release-readiness:
    name: Package & Consumer Smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
      - uses: dtolnay/rust-toolchain@efa25f7f19611383d5b0ccf2d1c8914531636bf9 # stable
      - uses: Swatinem/rust-cache@ad397744b0d591a723ab90405b7247fac0e6b8db # v2
      - name: Build all targets
        run: cargo build --locked --all-targets --all-features
        env:
          CARGO_TERM_COLOR: always
      - name: Verify package and publish dry-run
        run: |
          cargo package --locked
          cargo publish --dry-run --locked --no-verify
        env:
          CARGO_TERM_COLOR: always
      - name: Check from a clean consumer
        run: |
          VERSION=$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["package"]["version"])')
          rm -rf target/consumer-smoke "target/package/ojs-${VERSION}"
          mkdir -p target/consumer-smoke/src
          tar -xzf "target/package/ojs-${VERSION}.crate" -C target/package
          cat > target/consumer-smoke/Cargo.toml <<EOF
          [package]
          name = "ojs-consumer-smoke"
          version = "0.0.0"
          edition = "2021"
          publish = false

          [dependencies]
          ojs = { path = "../package/ojs-${VERSION}" }
          uuid = "=1.26.0"
          indexmap = "=2.14.1"
          EOF
          printf 'use ojs as _;\nuse indexmap::IndexMap;\nuse uuid::Uuid;\nfn main() { let _ = Uuid::nil(); let _: IndexMap<String, String> = IndexMap::new(); }\n' > target/consumer-smoke/src/main.rs
          cargo generate-lockfile --manifest-path target/consumer-smoke/Cargo.toml
          cargo check --locked --manifest-path target/consumer-smoke/Cargo.toml
          cargo tree --locked --manifest-path target/consumer-smoke/Cargo.toml | grep -F "uuid v1.26.0"
          cargo tree --locked --manifest-path target/consumer-smoke/Cargo.toml | grep -F "indexmap v2.14.1"
        env:
          CARGO_TERM_COLOR: always
